<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- คำสั่งหลัก: สั่งให้รีเฟรชหน้าไปที่ URL ใหม่ทันที (0 วินาที) -->
    <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbzXEZ13_KGaj1X9MJ80CxBm95JAynzMmbnL_YCWE2BZdZnzXUfzkhimxq_dEZK0cmJHmA/exec">
    <title>กำลังพากลับไปยังระบบ...</title>
    
    <!-- คำสั่งสำรอง: ใช้ JavaScript เผื่อเว็บบราวเซอร์บางตัวปิดระบบ Auto Refresh -->
    <script>
        window.location.href = "https://script.google.com/macros/s/AKfycbzXEZ13_KGaj1X9MJ80CxBm95JAynzMmbnL_YCWE2BZdZnzXUfzkhimxq_dEZK0cmJHmA/exec";
    </script>

    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            text-align: center;
            padding-top: 20vh;
            background-color: #f8f9fa;
            color: #333;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>กำลังพาคุณไปยังหน้าเว็บ...</p>
    <p style="font-size: 14px; color: #666;">หากไม่เปลี่ยนหน้าอัตโนมัติ <a href="https://script.google.com/macros/s/AKfycbzXEZ13_KGaj1X9MJ80CxBm95JAynzMmbnL_YCWE2BZdZnzXUfzkhimxq_dEZK0cmJHmA/exec">คลิกที่นี่</a></p>
</body>
</html>
