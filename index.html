<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบประเมิน</title> <!-- เปลี่ยนชื่อ Title ตรงนี้ได้ครับ -->
    <style>
        /* รีเซ็ตขอบหน้าจอให้เป็น 0 เพื่อให้เว็บแสดงผลเต็มขอบพอดี */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* ซ่อนแถบเลื่อนของหน้าจอหลัก เพื่อใช้แถบเลื่อนของ Apps Script แทน */
        }
        /* ตั้งค่ากรอบ Iframe ให้เต็ม 100% ของหน้าจอ */
        iframe {
            width: 100%;
            height: 100%;
            border: none; /* เอาเส้นขอบออก */
            display: block;
        }
    </style>
</head>
<body>
    <!-- ดึงหน้า Google Apps Script มาแสดงผลข้างในกรอบ -->
    <iframe src="https://script.google.com/macros/s/AKfycbzXEZ13_KGaj1X9MJ80CxBm95JAynzMmbnL_YCWE2BZdZnzXUfzkhimxq_dEZK0cmJHmA/exec" allowfullscreen></iframe>
</body>
</html>
